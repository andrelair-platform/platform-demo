---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-demo
  description: |
    Go HTTP service used as the reference CI/CD pipeline subject. Demonstrates
    the full minicloud delivery path: Harbor push → Argo Rollouts canary with
    Prometheus AnalysisTemplate gates → GitOps promotion to staging via PR →
    ephemeral preview environments per labeled PR. Live at demo.devandre.sbs.
  annotations:
    backstage.io/source-location: url:https://github.com/andrelair-platform/platform-demo
    github.com/project-slug: andrelair-platform/platform-demo
    argocd/app-name: platform-demo-dev
    backstage.io/kubernetes-id: platform-demo
    prometheus.io/rule: http_request_duration_seconds_count{namespace="platform-demo-dev"}
    grafana/dashboard-selector: namespace=platform-demo-dev
    plane.io/project-id: "PT"
  tags:
    - go
    - service
    - demo
    - cicd
    - argo-rollouts
    - preview-environments
  links:
    - url: https://demo.devandre.sbs
      title: Live service (public, via Cloudflare Tunnel)
      icon: web
    - url: https://argocd.10.0.0.200.nip.io/applications/platform-demo-dev
      title: ArgoCD — dev
      icon: dashboard
    - url: https://argocd.10.0.0.200.nip.io/applications/platform-demo-staging
      title: ArgoCD — staging
      icon: dashboard
    - url: https://argocd.10.0.0.200.nip.io/applications/platform-demo
      title: ArgoCD — prod
      icon: dashboard
    - url: https://harbor.10.0.0.200.nip.io/harbor/projects/1/repositories/platform-demo
      title: Harbor registry
      icon: image
    - url: https://github.com/andrelair-platform/platform-demo
      title: Source code
      icon: github
spec:
  type: service
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
  providesApis:
    - platform-demo-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: platform-demo-api
  description: Minimal Go HTTP service demonstrating the full minicloud CI/CD pipeline. Returns build metadata as JSON.
  annotations:
    github.com/project-slug: andrelair-platform/platform-demo
  tags:
    - go
    - rest
    - demo
spec:
  type: openapi
  lifecycle: production
  owner: andrelair-platform
  system: minicloud-platform
  definition: |
    openapi: "3.0.3"
    info:
      title: platform-demo API
      version: "1.0.0"
      description: >
        Minimal Go service that demonstrates the minicloud CI/CD pipeline end-to-end.
        Returns build metadata (version, git SHA, hostname) as JSON.
    servers:
      - url: https://demo.devandre.sbs
        description: Public (via Cloudflare Tunnel)
      - url: http://platform-demo.platform-demo-dev.svc.cluster.local:9898
        description: In-cluster (dev)
    paths:
      /:
        get:
          summary: Build metadata
          operationId: getMetadata
          description: Returns app version, git commit SHA, hostname, Go version and current timestamp.
          responses:
            "200":
              description: Build metadata
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      app:
                        type: string
                        example: platform-demo
                      version:
                        type: string
                        example: "1.0.0"
                      commit:
                        type: string
                        example: abc1234
                      hostname:
                        type: string
                      go_version:
                        type: string
                        example: go1.25.0
                      now:
                        type: string
                        format: date-time
      /healthz:
        get:
          summary: Liveness probe
          operationId: healthz
          responses:
            "200":
              description: ok
      /readyz:
        get:
          summary: Readiness probe
          operationId: readyz
          responses:
            "200":
              description: ready
