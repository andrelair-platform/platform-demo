name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

env:
  REGISTRY: harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/platform-demo
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  # ── 1. Unit tests + static security ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests
        run: go test -v -count=1 ./...

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static security analysis (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium ./...

  # ── 2. Build, scan, sign ────────────────────────────────────────────────────
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}
      branch: ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            TAG="${SHA}"
          else
            TAG="${BRANCH}-${SHA}"
          fi
          echo "image_tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"         >> "$GITHUB_OUTPUT"
          echo "version=${SHA}"           >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push to Harbor
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        if: github.ref_name == 'main'
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — GitHub OIDC → Sigstore Fulcio)
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # ── 3. GitOps bump ──────────────────────────────────────────────────────────
  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Determine gitops overlay path
        id: overlay
        run: |
          case "${{ needs.build-and-push.outputs.branch }}" in
            main)    echo "path=services/platform-demo/minicloud-1/dev" >> $GITHUB_OUTPUT ;;
            staging) echo "path=services/platform-demo/minicloud-1/staging" >> $GITHUB_OUTPUT ;;
            dev)     echo "path=services/platform-demo/minicloud-1/dev" >> $GITHUB_OUTPUT ;;
          esac

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.6.0"

      - name: Verify image exists in Harbor before gitops bump
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          URL="https://${{ env.REGISTRY }}/v2/${{ env.IMAGE_NAME }}/manifests/${TAG}"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --cacert /usr/local/share/ca-certificates/minicloud-ca.crt \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            -H "Authorization: Basic $(echo -n '${{ secrets.HARBOR_USER }}:${{ secrets.HARBOR_PASSWORD }}' | base64)" \
            "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "Image $TAG not found in Harbor (HTTP $STATUS) — aborting gitops bump"
            exit 1
          fi
          echo "Image $TAG confirmed in Harbor (HTTP $STATUS)"

      - name: Bump image tag in overlay and open auto-merged PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHA="${{ needs.build-and-push.outputs.image_tag }}"
          BRANCH="ci/platform-demo-${SHA}"
          git checkout -b "${BRANCH}"
          cd "${{ steps.overlay.outputs.path }}"
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          cd -
          git add "${{ steps.overlay.outputs.path }}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No change — image already at ${SHA}"
            exit 0
          fi
          git commit -S -m "ci(platform-demo): bump ${{ needs.build-and-push.outputs.branch }} image to ${SHA}"
          git push origin "${BRANCH}"
          gh pr create \
            --repo ${{ env.GITOPS_REPO }} \
            --base main \
            --head "${BRANCH}" \
            --title "ci(platform-demo): bump ${{ needs.build-and-push.outputs.branch }} image to ${SHA}" \
            --body "Automated image promotion from CI run ${{ github.run_id }}."
          gh pr merge "${BRANCH}" \
            --repo ${{ env.GITOPS_REPO }} \
            --admin --merge --delete-branch

  # ── 4. Post-deploy smoke test + integration tests ───────────────────────────
  # Runs only on main branch pushes (dev overlay auto-syncs).
  # Waits for Argo Rollout to reach Healthy, then does an HTTP probe via a
  # transient curl pod in the cluster. Uses the static-cert kubeconfig stored
  # in KUBE_CONFIG_BASE64 (org secret) so no OIDC browser flow is needed.
  smoke-test:
    needs: bump-gitops
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Set up kubectl
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config

      - name: Wait for Rollout to reach Healthy (max 5 min)
        run: |
          echo "Waiting for ArgoCD to pick up the new image tag..."
          sleep 40
          for i in $(seq 1 27); do
            PHASE=$(kubectl get rollout platform-demo -n platform-demo-dev \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "[$i/27] phase=${PHASE}"
            if [ "$PHASE" = "Healthy" ]; then
              echo "Rollout is Healthy"
              exit 0
            fi
            if [ "$PHASE" = "Degraded" ]; then
              echo "Rollout is Degraded — aborting"
              kubectl argo rollouts logs platform-demo -n platform-demo-dev --tail 50 || true
              exit 1
            fi
            sleep 10
          done
          echo "Timeout after 5 min waiting for Healthy"
          kubectl describe rollout platform-demo -n platform-demo-dev || true
          exit 1

      - name: HTTP smoke probe (curl pod in cluster)
        run: |
          kubectl run smoke-${{ github.run_id }} \
            --image=curlimages/curl:8 \
            --restart=Never \
            --rm \
            -n platform-demo-dev \
            --timeout=30s \
            -- -sf --max-time 5 http://platform-demo:9898/healthz
          echo "Smoke probe: /healthz OK"

          kubectl run smoke-root-${{ github.run_id }} \
            --image=curlimages/curl:8 \
            --restart=Never \
            --rm \
            -n platform-demo-dev \
            --timeout=30s \
            -- -sf --max-time 5 -o /dev/null -w "%{http_code}" http://platform-demo:9898/ \
            | grep -q "200"
          echo "Smoke probe: / OK"

      - name: Run integration tests against dev
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Integration tests (port-forward → local)
        run: |
          kubectl port-forward svc/platform-demo 9898:9898 -n platform-demo-dev &
          PF_PID=$!
          sleep 3
          go test -tags integration -v -count=1 -timeout=60s ./...
          kill $PF_PID || true

  # ── 5. k6 canary load injection (parallel with smoke-test) ──────────────────
  # Fires immediately after bump-gitops so k6 traffic is flowing DURING the
  # Argo Rollouts AnalysisRun. The analysis step (inline in the canary strategy)
  # has initialDelay: 60s, ensuring ≥2 Prometheus recording intervals of real
  # traffic exist before the first gate check executes.
  #
  # Timeline:
  #   t=0   bump-gitops merges
  #   t~30  ArgoCD syncs new image tag, canary pods start
  #   t~40  port-forward ready, k6 starts (after 30s sleep below)
  #   t~60  canary 30s pause ends, AnalysisRun created
  #   t~120 first gate check fires (initialDelay: 60s) — k6 has ~80s of data
  #   t~270 analysis completes (5 checks × 30s = 150s + 60s delay)
  #   t~300 setWeight 100, Rollout Healthy
  #
  # promote-staging depends on BOTH canary-load AND smoke-test passing.
  canary-load:
    needs: bump-gitops
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Set up kubectl
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl" -o kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 -d > ~/.kube/config

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -q k6

      - name: Wait for ArgoCD sync then port-forward
        run: |
          echo "Waiting 30s for ArgoCD to pick up the new image tag..."
          sleep 30
          kubectl port-forward svc/platform-demo 9898:9898 -n platform-demo-dev &
          echo "PF_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Run k6 canary load test (5 min — covers analysis window)
        run: k6 run -e CANARY_DURATION=5m k6/smoke.js

      - name: Teardown port-forward
        if: always()
        run: kill $PF_PID || true

  # ── 6. Auto-promote to staging (main branch only, after both gates pass) ────
  promote-staging:
    needs: [smoke-test, canary-load]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.6.0"

      - name: Open staging promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SHA: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          # Re-derive tag from the image that just passed smoke + load test
          SHA="${{ needs.build-and-push.outputs.image_tag }}"
          BRANCH="ci/promote-platform-demo-staging-${SHA}"
          git checkout -b "${BRANCH}"
          cd services/platform-demo/minicloud-1/staging
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          cd -
          git add services/platform-demo/minicloud-1/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Staging already at ${SHA} — nothing to promote"
            exit 0
          fi
          git commit -S -m "ci(platform-demo): promote ${SHA} to staging"
          git push origin "${BRANCH}"
          gh pr create \
            --repo ${{ env.GITOPS_REPO }} \
            --base main \
            --head "${BRANCH}" \
            --title "promote(platform-demo): ${SHA} → staging" \
            --body "$(cat <<'BODY'
Auto-generated staging promotion after:
- Unit tests passed
- Container image built, Trivy scanned, Cosign signed
- Argo Rollout reached Healthy in dev
- HTTP smoke probes passed
- k6 load test passed (p95 < 500ms, error rate < 1%)

**Merge this PR to deploy to staging. Manual ArgoCD sync required after merge.**
BODY
)"
          echo "Staging promotion PR created for ${SHA}"
