name: CI
# Registry auth (org secrets): HARBOR_USER/HARBOR_PASSWORD (robot$ci) for dev images
# in Harbor; GITHUB_TOKEN for prod images in ghcr.io (public). Keep the Harbor robot
# secret in sync with Vault secret/platform/harbor -> robot-ci-secret.

on:
  # main-only: Kargo owns dev→prod promotion from the main build (fully cut over —
  # no dev-branch/bump-gitops track). dev iteration is local/preview, not a deployed track.
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/platform-demo
  GHCR_IMAGE: ghcr.io/andrelair-platform/platform-demo   # prod images (public, free, off local disk)
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  # ── 1. Unit tests + static security ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests
        run: go test -v -count=1 ./...

      - name: Vulnerability check (govulncheck)
        run: |
          # Pinned (not @latest) for reproducible builds — 12-factor #2. v1.8.0 needs Go >= 1.26;
          # CI runs Go 1.25, so v1.1.4 (the vuln DB is queried live regardless of binary version).
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Static security analysis (gosec)
        run: |
          # Pinned (not @latest) for reproducible builds — 12-factor #2 (Renovate bumps it via PR).
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity high -confidence medium ./...

  # ── 2. Build, scan, sign ────────────────────────────────────────────────────
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write          # push prod images to ghcr.io (public)
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}
      branch: ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            TAG="${SHA}"
          else
            TAG="${BRANCH}-${SHA}"
          fi
          echo "image_tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}"         >> "$GITHUB_OUTPUT"
          echo "version=${SHA}"           >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Hybrid registry (2-env): dev images -> Harbor; prod (main) images also
          # -> ghcr.io (public, durable, off the controller disk). Build push targets:
          HARBOR_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${HARBOR_REF}"$'\n'"${{ env.GHCR_IMAGE }}:${TAG}"
          else
            TAGS="${HARBOR_REF}"
          fi
          { echo "tags<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR (prod images)
        if: github.ref_name == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push to Harbor
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        if: github.ref_name == 'main'
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — GitHub OIDC → Sigstore Fulcio)
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Prod artifact lives in ghcr.io — sign + attach SBOM there too (same digest).
      - name: Sign ghcr image (keyless)
        if: github.ref_name == 'main'
        run: |
          cosign sign --yes \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to ghcr image
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

  # ── 3. Promotion + dev verification are handled by KARGO, not CI ─────────────
  # CI ends at "build a verified, immutable artifact" (unit tests, Trivy, Cosign, SBOM,
  # dual-push Harbor + ghcr). It NO LONGER bumps the dev overlay or smoke-tests the dev
  # deploy from CI — that was a sync-over-async anti-pattern once Kargo owns dev promotion.
  #
  # Now the flow is fully Kargo-driven:
  #   1. Warehouse detects the new ghcr image (Freight).
  #   2. ProjectConfig autoPromotionEnabled → Freight auto-promoted to the dev Stage.
  #   3. The dev Stage's verification runs the smoke AnalysisRun
  #      (services/platform-demo/kargo/analysis-dev-smoke.yaml) — an end-to-end probe
  #      through the KEDA interceptor. Only a Freight VERIFIED in dev is promotable.
  #   4. The prod Stage (sources.stages: [dev]) opens a CODEOWNERS-gated prod PR.
  # See services/platform-demo/kargo/ in minicloud-gitops. (2-env standard: dev + prod.)
