name: Preview

# Deploys an ephemeral ArgoCD Application to preview-pd-<number> namespace
# whenever a PR carries the "preview" label.
#
# Lifecycle:
#   labeled:preview / opened / synchronize  →  build pr-<n>-<sha> image, push Application
#   unlabeled:preview / closed              →  remove Application (finalizer prunes namespace)
#
# ArgoCD root-app recurse:true watches apps/previews/ in minicloud-gitops.
# Any .yaml file created there is auto-discovered and synced within ~30s.
# The resources-finalizer.argocd.argoproj.io on the Application deletes the
# namespace and all managed resources when the Application is deleted.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

env:
  REGISTRY: harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/platform-demo
  GITOPS_REPO: andrelair-platform/minicloud-gitops

# Serialise per-PR runs: a `labeled` + `synchronize` (or rapid pushes) must not race on the
# per-PR preview/pd-<n> branch (non-fast-forward push). One run per PR; newest wins.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Build the PR image and push the ArgoCD Application to gitops ─────────────
  deploy-preview:
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (
        (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') &&
        contains(github.event.pull_request.labels.*.name, 'preview')
      )
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute preview image tag
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          PR=${{ github.event.pull_request.number }}
          echo "image_tag=pr-${PR}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NB: the gitops steps below talk to GitHub.com (public) only — no Tailscale/CA needed.
      # (Re-running tailscale/github-action here fails with "tailscaled: Text file busy".)
      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Write ArgoCD Application manifest and open PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          APP_NAME="preview-pd-${PR_NUMBER}"
          BRANCH="preview/pd-${PR_NUMBER}"
          git checkout -b "${BRANCH}" 2>/dev/null || git checkout "${BRANCH}"
          mkdir -p apps/previews

          python3 - "${PR_NUMBER}" "${IMAGE_TAG}" "${{ env.REGISTRY }}" "${{ env.IMAGE_NAME }}" <<'PYEOF'
          import sys, pathlib, textwrap

          pr, tag, registry, image = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          app_name = f"preview-pd-{pr}"
          ns = f"preview-pd-{pr}"
          # nip.io DASH form for the IP (10-0-0-200), not dotted: the "-<pr>" numeric suffix on the
          # label collides with nip.io's dotted-octet parsing (demo-pr-49.10.0.0.200 -> it reads the
          # IP as 49.10.0.0). Dash form is unambiguous -> demo-pr-<n>.10-0-0-200.nip.io -> 10.0.0.200.
          host = f"demo-pr-{pr}.10-0-0-200.nip.io"

          # The repo is Helm-only (no kustomize) — render the platform-demo wrapper chart with the
          # simplified values-preview.yaml overlay + a per-PR valuesObject (image tag, host, cert).
          manifest = textwrap.dedent(f"""\
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {app_name}
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: minicloud-platform
            source:
              repoURL: https://github.com/andrelair-platform/minicloud-gitops.git
              targetRevision: main
              path: services/platform-demo/helm
              helm:
                releaseName: platform-demo
                valueFiles:
                  - values-preview.yaml
                valuesObject:
                  minicloud-app-deployment:
                    image:
                      tag: "{tag}"
                    ingress:
                      hosts:
                        - {host}
                      tls:
                        secretName: {app_name}-tls
                  tlsCert:
                    name: {app_name}-tls
                    secretName: {app_name}-tls
                    dnsName: {host}
            destination:
              server: https://kubernetes.default.svc
              namespace: {ns}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - ServerSideDiff=true
                - RespectIgnoreDifferences=true
                - SkipDryRunOnMissingResource=true
          """)

          pathlib.Path(f"apps/previews/{app_name}.yaml").write_text(manifest)
          print(f"Wrote apps/previews/{app_name}.yaml (image: {registry}/{image}:{tag})")
          PYEOF

          git add "apps/previews/${APP_NAME}.yaml"
          if git diff --cached --quiet; then
            echo "No change — preview-pd-${PR_NUMBER} already at ${IMAGE_TAG}"
            exit 0
          fi
          git commit -S -m "preview(platform-demo): deploy pr-${PR_NUMBER} at ${IMAGE_TAG}"
          # Force-push: the preview branch is a throwaway, fully regenerated each run — if it exists
          # from a prior run its history may diverge (non-fast-forward). Force is safe (not main).
          git push --force origin "${BRANCH}"
          EXISTING=$(gh pr list --repo "${{ env.GITOPS_REPO }}" --head "${BRANCH}" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo "${{ env.GITOPS_REPO }}" \
              --base main \
              --head "${BRANCH}" \
              --title "preview(platform-demo): pr-${PR_NUMBER}" \
              --body "Preview environment for #${PR_NUMBER}: ${PR_TITLE}

          Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}\`
          Namespace: \`preview-pd-${PR_NUMBER}\`"
          fi
          # Wait for the gitops required checks, then squash-merge via the authoritative REST endpoint
          # (apps/previews/ is CODEOWNERS-exempt, so no review/--admin needed; merge-gate etc. still gate).
          # gh pr merge refuses client-side on a stale BLOCKED state; REST re-evaluates server-side.
          PR_NUM=$(gh pr list --repo "${{ env.GITOPS_REPO }}" --head "${BRANCH}" --json number --jq '.[0].number')
          for attempt in $(seq 1 24); do
            STATE=$(gh pr view "${PR_NUM}" --repo "${{ env.GITOPS_REPO }}" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            if [ "${STATE}" = "BEHIND" ]; then
              gh pr update-branch "${PR_NUM}" --repo "${{ env.GITOPS_REPO }}" >/dev/null 2>&1 || true
            elif [ "${STATE}" = "CLEAN" ] && gh api -X PUT "repos/${{ env.GITOPS_REPO }}/pulls/${PR_NUM}/merge" -f merge_method=squash >/dev/null 2>&1; then
              echo "Merged gitops preview PR #${PR_NUM}"
              gh api -X DELETE "repos/${{ env.GITOPS_REPO }}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
              exit 0
            fi
            echo "attempt ${attempt}: gitops PR #${PR_NUM} mergeState=${STATE}; retry in 15s"
            sleep 15
          done
          echo "::error::gitops preview PR #${PR_NUM} never reached a mergeable state"; exit 1

  # ── Remove the Application manifest (ArgoCD finalizer cleans up namespace) ───
  teardown-preview:
    if: >
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Remove Application and push
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          APP_FILE="apps/previews/preview-pd-${PR_NUMBER}.yaml"
          if [ ! -f "${APP_FILE}" ]; then
            echo "No preview manifest for pr-${PR_NUMBER} — nothing to tear down"
            exit 0
          fi

          BRANCH="preview/pd-${PR_NUMBER}-teardown"
          git checkout -B "${BRANCH}"
          git rm "${APP_FILE}"
          git commit -S -m "preview(platform-demo): teardown pr-${PR_NUMBER}"
          git push --force origin "${BRANCH}"
          EXISTING=$(gh pr list --repo "${{ env.GITOPS_REPO }}" --head "${BRANCH}" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --repo "${{ env.GITOPS_REPO }}" \
              --base main \
              --head "${BRANCH}" \
              --title "preview(platform-demo): teardown pr-${PR_NUMBER}" \
              --body "Tear down preview environment for #${PR_NUMBER}."
          fi
          # Same robust path as deploy: wait for checks, squash-merge via REST (no --admin needed).
          PR_NUM=$(gh pr list --repo "${{ env.GITOPS_REPO }}" --head "${BRANCH}" --json number --jq '.[0].number')
          for attempt in $(seq 1 24); do
            STATE=$(gh pr view "${PR_NUM}" --repo "${{ env.GITOPS_REPO }}" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo UNKNOWN)
            if [ "${STATE}" = "BEHIND" ]; then
              gh pr update-branch "${PR_NUM}" --repo "${{ env.GITOPS_REPO }}" >/dev/null 2>&1 || true
            elif [ "${STATE}" = "CLEAN" ] && gh api -X PUT "repos/${{ env.GITOPS_REPO }}/pulls/${PR_NUM}/merge" -f merge_method=squash >/dev/null 2>&1; then
              echo "Merged gitops teardown PR #${PR_NUM}"
              gh api -X DELETE "repos/${{ env.GITOPS_REPO }}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
              exit 0
            fi
            echo "attempt ${attempt}: gitops teardown PR #${PR_NUM} mergeState=${STATE}; retry in 15s"
            sleep 15
          done
          echo "::error::gitops teardown PR #${PR_NUM} never reached a mergeable state"; exit 1
